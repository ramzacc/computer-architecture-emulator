<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Canvas Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Grid Canvas</h1>
    <div class="toolbar">
      <button id="btn-select" class="mode">Select mode</button>
      <button id="btn-wire" class="mode">Wire mode</button>
      <button id="btn-pan" class="mode">Pan mode</button>
      <button id="btn-copy" disabled>Copy</button>
      <button id="btn-paste" disabled>Paste</button>
      <button id="btn-delete" disabled>Delete</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>File</h2>
      <div class="file-actions">
        <button id="btn-download">Save to file</button>
        <label class="file-label">
          <span>Import from file</span>
          <input id="file-input" type="file" accept="application/json,.json" />
        </label>
      </div>
      <h2>Wire properties</h2>
      <label class="property">New wire size (bits)
        <input id="new-wire-size" type="number" min="1" max="32" step="1" value="1" />
      </label>
      <h2>Components</h2>
      <label class="palette-search-label" for="palette-search">Search components</label>
      <input id="palette-search" class="palette-search" type="search" placeholder="Search components…" autocomplete="off" />
      <div id="palette" class="palette"></div>
      <p id="palette-empty" class="hint" role="status" hidden>No matching components.</p>
      <h2 id="selected-properties-heading">Selected properties</h2>
      <label id="selected-size-row" class="property" hidden><span id="selected-size-label">Selected size (bits)</span>
        <input id="selected-size" type="number" min="1" max="32" step="1" disabled />
      </label>
      <label id="channels-row" class="property" hidden>Data channels
        <input id="channels" type="number" min="1" max="16" step="1" disabled />
      </label>
      <label id="splitter-order-row" class="property" hidden>Order
        <select id="splitter-order" disabled>
          <option value="ascendant">Ascendant</option>
          <option value="descendant">Descendant</option>
        </select>
      </label>
      <label id="constant-value-row" class="property" hidden>Constant value
        <input id="constant-value" type="text" inputmode="text" spellcheck="false" disabled />
      </label>
      <label id="value-format-row" class="property" hidden>Value format
        <select id="value-format" disabled>
          <option value="decimal">Decimal</option>
          <option value="binary">Binary (0b)</option>
          <option value="hex">Hex (0x)</option>
        </select>
      </label>
      <label id="clock-frequency-row" class="property" hidden>Frequency (Hz)
        <input id="clock-frequency" type="number" min="0.1" max="20" step="0.1" disabled />
      </label>
      <div id="selected-value-row" class="property bus-value-row" hidden>
        <span id="selected-value-label">Selected bus value</span>
        <output id="selected-value" aria-live="polite">—</output>
      </div>
      <p id="bus-status" class="hint" role="status">Select a wire net or logic gate to edit its size.</p>
    </section>

    <section id="canvas-wrap" class="canvas-wrap">
      <div id="grid" class="grid" tabindex="0"></div>
      <div id="zoom-level" class="zoom-level">100%</div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
