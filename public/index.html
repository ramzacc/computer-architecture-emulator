<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Canvas Prototype</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="view-header">
    <div class="view-tabs" role="tablist" aria-label="Views">
      <button id="tab-canvas" type="button" role="tab" aria-controls="canvas-view" aria-selected="true">Canvas</button>
      <button id="tab-rom" type="button" role="tab" aria-controls="rom-view" aria-selected="false" tabindex="-1">ROM</button>
    </div>
    <button id="btn-theme" class="theme-toggle" type="button">Theme</button>
  </header>

  <main>
    <div id="canvas-view" class="canvas-view" role="tabpanel" aria-labelledby="tab-canvas">
    <section class="panel">
      <section class="library-section" aria-labelledby="library-heading">
        <h2 id="library-heading">Components</h2>
        <input id="palette-search" class="palette-search" type="search" placeholder="Search components…" aria-label="Search components" autocomplete="off" />
        <div id="palette" class="palette"></div>
        <p id="palette-empty" class="hint" role="status" hidden>No matching components.</p>
      </section>
      <section class="inspector-section" aria-labelledby="selected-properties-heading">
      <h2 id="selected-properties-heading">Inspector</h2>
      <p id="inspector-empty" class="hint">Select a component or wire to edit its properties.</p>
      <label id="new-wire-row" class="property" hidden>Wire size (bits)
        <input id="new-wire-size" type="number" min="1" max="32" step="1" value="1" />
      </label>
      <label id="selected-size-row" class="property" hidden><span id="selected-size-label">Selected size (bits)</span>
        <input id="selected-size" type="number" min="1" max="32" step="1" disabled />
      </label>
      <label id="rom-address-size-row" class="property" hidden>Address size (bits)
        <input id="rom-address-size" type="number" min="1" max="32" step="1" disabled />
      </label>
      <label id="channels-row" class="property" hidden>Data channels
        <input id="channels" type="number" min="1" max="16" step="1" disabled />
      </label>
      <label id="splitter-order-row" class="property" hidden>Order
        <select id="splitter-order" disabled>
          <option value="ascendant">Ascendant</option>
          <option value="descendant">Descendant</option>
        </select>
      </label>
      <label id="constant-value-row" class="property" hidden>Constant value
        <input id="constant-value" type="text" inputmode="text" spellcheck="false" disabled />
      </label>
      <div id="rom-data-row" class="rom-data-property" hidden>
        <label for="rom-data">ROM contents (hex address: value)</label>
        <textarea id="rom-data" rows="8" spellcheck="false" placeholder="00: FF&#10;01: 3A" disabled></textarea>
        <button id="rom-apply" type="button" disabled>Apply ROM contents</button>
        <span id="rom-data-hint">Unlisted addresses read as zero. One entry per line.</span>
      </div>
      <label id="value-format-row" class="property" hidden>Value format
        <select id="value-format" disabled>
          <option value="decimal">Decimal</option>
          <option value="binary">Binary (0b)</option>
          <option value="hex">Hex (0x)</option>
        </select>
      </label>
      <label id="clock-frequency-row" class="property" hidden>Frequency (Hz)
        <input id="clock-frequency" type="number" min="0.1" max="20" step="0.1" disabled />
      </label>
      <label id="clock-enable-row" class="property" hidden>Enable clock
        <input id="clock-enable" type="checkbox" disabled />
      </label>
      <div id="selected-value-row" class="property bus-value-row" hidden>
        <span id="selected-value-label">Selected bus value</span>
        <output id="selected-value" aria-live="polite">—</output>
      </div>
      <p id="bus-status" class="hint" role="status" hidden></p>
      </section>
      <section class="file-section" aria-labelledby="file-heading">
        <h2 id="file-heading">File</h2>
        <div class="file-actions">
          <button id="btn-download">Save to file</button>
          <label class="file-label">
            <span>Import from file</span>
            <input id="file-input" type="file" accept="application/json,.json" />
          </label>
        </div>
      </section>
    </section>

    <section id="canvas-wrap" class="canvas-wrap">
      <div id="grid" class="grid" tabindex="0"></div>
      <div class="canvas-toolbar">
        <div class="canvas-modes canvas-controls" role="group" aria-label="Canvas mode">
          <button id="btn-select" class="mode" type="button" aria-label="Select mode">Select</button>
          <button id="btn-wire" class="mode" type="button" aria-label="Wire mode">Wire</button>
          <button id="btn-pan" class="mode" type="button" aria-label="Pan mode">Pan</button>
        </div>
        <div class="canvas-actions canvas-controls" role="group" aria-label="Edit selection">
          <button id="btn-copy" type="button" disabled>Copy</button>
          <button id="btn-paste" type="button" disabled>Paste</button>
          <button id="btn-delete" type="button" disabled>Delete</button>
        </div>
      </div>
      <div id="zoom-level" class="zoom-level">100%</div>
    </section>
    </div>
    <section id="rom-view" class="rom-view" role="tabpanel" aria-labelledby="tab-rom" hidden></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
