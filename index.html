<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Canvas Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Grid Canvas</h1>
    <div class="toolbar">
      <button id="btn-wire" class="mode">Wire mode</button>
      <button id="btn-pan" class="mode">Pan mode</button>
      <span class="divider"></span>
      <button id="btn-save">Save</button>
      <button id="btn-load">Load</button>
      <button id="btn-download">Download .json</button>
      <label class="file-label">
        <span>Import .json</span>
        <input id="file-input" type="file" accept="application/json,.json" />
      </label>
      <button id="btn-clear-wires">Clear wires</button>
      <button id="btn-clear" class="danger">Clear all</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Components</h2>
      <div id="palette" class="palette"></div>
      <h2>Bus properties</h2>
      <label class="property">New wire size (bits)
        <input id="new-wire-size" type="number" min="1" max="32" step="1" value="1" />
      </label>
      <label class="property">Selected size (bits)
        <input id="selected-size" type="number" min="1" max="32" step="1" disabled />
      </label>
      <p id="bus-status" class="hint" role="status">Select a wire net or logic gate to edit its size.</p>
      <h2>Canvas</h2>
      <p class="hint">
        Infinite grid. Drag empty space to pan. Scroll to move, Ctrl&nbsp;+&nbsp;scroll
        (or Ctrl&nbsp;+&nbsp;+/-) to zoom, Ctrl&nbsp;+&nbsp;0 to reset.
      </p>
    </section>

    <section id="canvas-wrap" class="canvas-wrap">
      <div id="grid" class="grid" tabindex="0"></div>
      <div id="zoom-level" class="zoom-level">100%</div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
